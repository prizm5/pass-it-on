services:
  db:
    image: postgres:16
    container_name: pass-it-on-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passiton}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-passiton}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pass-it-on-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-passiton};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Frontend__WebUrl: http://localhost:${WEB_PORT:-5173}
      Frontend__AdminUrl: http://localhost:${ADMIN_PORT:-5174}
      Jwt__Key: ${JWT_KEY:-}
      OAuth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      OAuth__Facebook__AppId: ${FACEBOOK_APP_ID:-}
      OAuth__Facebook__AppSecret: ${FACEBOOK_APP_SECRET:-}
      AdminSeed__Enabled: ${ADMIN_SEED_ENABLED:-true}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-admin@passiton.local}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-}
      AdminSeed__DisplayName: ${ADMIN_SEED_DISPLAY_NAME:-Pass It On Admin}
      ImageStorage__Enabled: ${IMAGE_STORAGE_ENABLED:-false}
      ImageStorage__BucketName: ${IMAGE_STORAGE_BUCKET_NAME:-}
      ImageStorage__Region: ${IMAGE_STORAGE_REGION:-us-east-1}
      ImageStorage__PublicBaseUrl: ${IMAGE_STORAGE_PUBLIC_BASE_URL:-}
      ImageStorage__KeyPrefix: ${IMAGE_STORAGE_KEY_PREFIX:-listings}
      ImageStorage__MaxFileSizeBytes: ${IMAGE_STORAGE_MAX_FILE_SIZE_BYTES:-5242880}
      ImageStorage__MaxImagesPerListing: ${IMAGE_STORAGE_MAX_IMAGES_PER_LISTING:-8}
      ImageStorage__PresignedUrlMinutes: ${IMAGE_STORAGE_PRESIGNED_URL_MINUTES:-10}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5200}:5200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5200/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-5200}/api
    container_name: pass-it-on-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-5200}/api
    container_name: pass-it-on-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-5174}:5174"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5174 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
